name: Clean-machine quick start check

# Proves the README's "Availability" quick start actually works on a fresh
# checkout with nothing pre-installed -- not just inside the internal
# quantum-map dev environment where this tool originates. Runs the exact
# three commands a judge/reviewer would copy from the README.

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  quick_start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip install -r pqc_reduction_audit/requirements.txt
        run: pip install -r pqc_reduction_audit/requirements.txt

      - name: Reproducible known-answer run (README "Availability" section)
        run: bash pqc_reduction_audit/run_known_answer.sh
